<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake 3D</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js is installed with npm and loaded from the local node_modules folder -->
  <script type="importmap">
  {
    "imports": {
      "three": "../node_modules/three/build/three.module.js",
      "three/addons/": "../node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
    <div class="title">SNAKE <b>3D</b></div>
    <div class="stat right"><span class="label">Best</span><span id="best" class="value">0</span></div>
  </div>

  <div id="overlay" class="visible">
    <div class="card">
      <h1 id="overlay-title">SNAKE <b>3D</b></h1>
      <p id="overlay-sub">Eat the apples. Don't hit the walls or yourself.</p>
      <div id="overlay-score" hidden>
        <span class="label">Final score</span><span id="final-score">0</span>
        <span id="new-best" hidden>New best!</span>
      </div>
      <button id="start-btn">Play</button>
      <p class="hint"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer &nbsp;·&nbsp; <kbd>Enter</kbd> to start / restart</p>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
